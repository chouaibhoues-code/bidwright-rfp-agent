# docker compose up -d starts the app, Phoenix and the Docling parser service. Profiles add the rest:
#   docker compose run --rm demo     replay the recorded run, with no network and no LLM call
#   docker compose run --rm test     the replay tests, with no network and no LLM call
# Compose refuses every command while GEMINI_API_KEY is unset, these two included (ADR-002);
# the keyless path is the host: uv run bidwright demo, uv run pytest.
#   docker compose --profile eval run --rm eval score outputs/<run>
#   docker compose --profile local up -d ollama
# Only loopback ports are published. Keys come from .env and are never written here.
name: bidwright

x-image: &image
  image: bidwright:0a
  build: .

services:
  app:
    <<: *image
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env for live runs}
      GEMINI_PAID_API_KEY: ${GEMINI_PAID_API_KEY:-}
      PHOENIX_ENDPOINT: http://phoenix:6006
      PHOENIX_API_KEY: ${PHOENIX_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      DOCLING_URL: http://docling:5001
      # The host's NotebookLM server, for research mode live (S-11). A fixed value, so a host
      # .env address, which names 127.0.0.1, never reaches the container.
      NOTEBOOKLM_MCP_URL: http://host.docker.internal:8000/mcp
    # host.docker.internal is the host machine, so OLLAMA_HOST=http://host.docker.internal:11434
    # reaches the host's own Ollama. Docker Desktop resolves the name already; this line adds it
    # on Linux, where that Ollama must also listen beyond loopback.
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./inputs:/app/inputs:ro
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro
      - ./research_packs:/app/research_packs:ro
      - ./outputs:/app/outputs
    depends_on: [phoenix, docling]

  # The parser service (Iteration 1): PDF, DOCX and XLSX through its v1 API, on loopback only.
  # V-08 (2026-11-03) pinned the current release by digest. The demo and test services never
  # reach it: Docling responses replay from tests/cassettes/docling/.
  docling:
    image: ghcr.io/docling-project/docling-serve-cpu:v1.38.2@sha256:7a480a1604fa3b42efeddc7db9527690d9f9bc903226136013e2bfe6b1a4dfb0
    ports: ["127.0.0.1:5001:5001"]

  phoenix:
    image: arizephoenix/phoenix:version-21.0.0@sha256:1f9a144a5357b4973e93a15718f050247cb7a4ee7b7c6c06ecb91b5eed3fbaad
    ports: ["127.0.0.1:6006:6006"]
    # Phoenix 21 turns authentication on by default. This collector is local, published on
    # loopback only, and holds spans of synthetic runs, so it starts with authentication off.
    # To turn it on: set PHOENIX_ENABLE_AUTH=true in .env, create a system key in Phoenix,
    # and put it in PHOENIX_API_KEY, which the app sends as a bearer token.
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_ENABLE_AUTH: ${PHOENIX_ENABLE_AUTH:-false}
    volumes: [phoenix-data:/mnt/data]

  eval:
    <<: *image
    profiles: [eval]
    entrypoint: ["bidwright-eval"]
    volumes:
      - ./evals/corpus:/app/evals/corpus:ro
      - ./evals/gold:/app/evals/gold:ro
      - ./evals/results:/app/evals/results
      - ./outputs:/app/outputs:ro

  test:
    <<: *image
    profiles: [test]
    network_mode: none
    entrypoint: ["pytest", "-m", "not gold", "-p", "no:cacheprovider"]
    volumes:
      - ./tests/cassettes:/app/tests/cassettes:ro

  demo:
    <<: *image
    profiles: [demo]
    network_mode: none
    command: ["demo"]
    volumes:
      - ./tests/cassettes:/app/tests/cassettes:ro
      - ./outputs:/app/outputs

  ollama:
    image: ollama/ollama:0.40.13@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
    profiles: [local]
    ports: ["127.0.0.1:11434:11434"]
    volumes: [ollama-models:/root/.ollama]

volumes:
  phoenix-data:
  ollama-models:
