# The hypotheses of Iteration 1's spikes, one block per matrix file in config/matrices/
# (Iteration 1, steps 5 and 18). Each names its control rung and, per rung, the scorer's
# metric, the decision kind and the hypothesis in words. The decision kinds are defined in
# step 18: `within_noise` keeps the cheaper rung when it stays within the control's spread,
# `superiority` needs the rung to beat the control by more than that spread, and
# `improvement` needs the metric to improve while the `secondary` metric loses at most
# `max_drop`. bidwright-eval hash-gold freezes this file with the gold, before the first
# matrix run. Rung names are quoted, because YAML reads a bare on and off as booleans.
s03-batch:
  control: "b10"
  rungs:
    "b20": {metric: missed_mandatory_count, kind: within_noise, hypothesis: "Packs of 20 lose no more mandatory requirements than packs of 10, within the control's spread"}
    "b40": {metric: missed_mandatory_count, kind: within_noise, hypothesis: "Packs of 40 lose no more mandatory requirements than packs of 10, within the control's spread"}
s10-examples:
  control: "noexamples"
  rungs:
    "examples": {metric: missed_mandatory_count, kind: superiority, hypothesis: "The examples lower the median misses by more than the control's spread"}
s13-second-pass:
  control: "off"
  rungs:
    "on": {metric: missed_mandatory_count, kind: improvement, secondary: {metric: precision_low, max_drop: 0.03}, hypothesis: "The second pass lowers the median misses and costs at most 3 points of precision"}
ex-ladder:
  control: "ex0"
  rungs:
    "ex1": {metric: missed_mandatory_count, kind: keep_or_drop, direction: lower, margin: 1, secondary: {metric: precision_low, direction: higher}, hypothesis: "Bare extraction without triage or coverage loses no more than 1 additional mandatory requirement than the baseline while improving precision"}
    "ex2": {metric: missed_mandatory_count, kind: keep_or_drop, direction: lower, margin: 1, secondary: {metric: precision_low, direction: higher}, hypothesis: "Full context without triage or coverage loses no more than 1 additional mandatory requirement while improving precision"}
    "ex3": {metric: missed_mandatory_count, kind: keep_or_drop, direction: lower, margin: 1, secondary: {metric: precision_low, direction: higher}, hypothesis: "Triage and coverage without second pass lose no more than 1 additional mandatory requirement while improving precision"}
    "ex4": {metric: missed_mandatory_count, kind: keep_or_drop, direction: lower, margin: 1, secondary: {metric: precision_low, direction: higher}, hypothesis: "Full extraction with second pass loses no more than 1 additional mandatory requirement while improving precision"}
so-ladder:
  control: "so0"
  rungs:
    "so1-f": {metric: gap_assertions, kind: keep_or_drop, direction: lower, margin: 0, secondary: {metric: approach_mapping, direction: higher}, hypothesis: "The fixed retrieval asserts no more gaps than the one-call baseline and maps more binding requirements"}
    "so1": {metric: gap_assertions, kind: keep_or_drop, direction: lower, margin: 0, secondary: {metric: approach_mapping, direction: higher}, hypothesis: "Decide agent asserts no more gaps than the one-call baseline and maps more binding requirements"}
    "so1-t": {metric: gap_assertions, kind: keep_or_drop, direction: lower, margin: 0, secondary: {metric: approach_mapping, direction: higher}, compare_to: "so1", hypothesis: "Reflection after a failed tool call asserts no more gaps than decide alone and maps more binding requirements"}
    "so2": {metric: gap_assertions, kind: keep_or_drop, direction: lower, margin: 0, secondary: {metric: approach_mapping, direction: higher}, hypothesis: "Independent assessment asserts no more gaps than the baseline and maps more binding requirements"}
    "so3": {metric: gap_assertions, kind: keep_or_drop, direction: lower, margin: 0, secondary: {metric: approach_mapping, direction: higher}, hypothesis: "Full manifest generation asserts no more gaps than the baseline and maps more binding requirements"}
rk-ladder:
  control: "rk0"
  rungs:
    "rk1-f": {metric: risk_seed_recall, kind: keep_or_drop, direction: higher, secondary: {metric: generic_risks_rejected, direction: lower}, hypothesis: "Fixed risk retrieval achieves higher risk seed recall with fewer generic risks rejected"}
    "rk1": {metric: risk_seed_recall, kind: keep_or_drop, direction: higher, secondary: {metric: generic_risks_rejected, direction: lower}, hypothesis: "Risk agent achieves higher risk seed recall with fewer generic risks rejected"}
    "rk1-t": {metric: risk_seed_recall, kind: keep_or_drop, direction: higher, secondary: {metric: generic_risks_rejected, direction: lower}, compare_to: "rk1", hypothesis: "Risk reflection achieves higher risk seed recall than risk agent alone with fewer generic risks rejected"}
s12-cards:
  control: "off"
  rungs:
    "on": {metric: violations, kind: superiority, hypothesis: "Model cards and checks reduce violations by more than the spread"}
s12-scorecard:
  control: "off"
  rungs:
    "on": {metric: missed_mandatory_count, kind: within_noise, hypothesis: "Model cards and checks stay within noise on missed mandatory requirements and seeded gaps claimed"}
