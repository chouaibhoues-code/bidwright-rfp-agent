  - {id: TS-04, type: tech, doc_id: hero-rfp, library: pdfplumber, text: "pdfplumber structure_tree accessibility features can be relied upon to extract structure from all PDFs.", holds: false}
  - {id: TS-05, type: tech, doc_id: hero-rfp, library: pdfplumber, text: "pdfplumber Page.extract_text_lines is a fully stable non-experimental feature.", holds: false}
  - {id: TS-06, type: tech, doc_id: hero-rfp, library: pdfplumber, text: "pdfplumber TableFinder vertical_strategy lines_strict uses rectangle sides as cell borders.", holds: false}
  - {id: TS-07, type: tech, doc_id: hero-rfp, library: pdfplumber, text: "pdfplumber Page.extract_words discards character bounding box coordinates.", holds: false}
  - {id: TS-08, type: tech, doc_id: hero-rfp, library: pdfplumber, text: "pdfplumber PageImage.save defaults to saving images in JPEG format.", holds: false}
  - {id: TS-09, type: tech, doc_id: hero-rfp, library: pdfplumber, text: "pdfplumber open with repair=True automatically saves the repaired PDF file to disk.", holds: false}
  - {id: TS-10, type: tech, doc_id: hero-rfp, library: pdfplumber, text: "pdfplumber PageImage draw_rect stroke_width defaults to 5 points.", holds: false}
  - {id: TS-11, type: tech, doc_id: hero-rfp, library: pdfplumber, text: "Page text is extracted using pdfplumber Page.extract_text with layout tolerance.", holds: true}
  - {id: TS-12, type: tech, doc_id: hero-rfp, library: pdfplumber, text: "pdfplumber Page.extract_text_simple provides faster text extraction from page characters.", holds: true}
  - {id: TS-13, type: tech, doc_id: hero-rfp, library: pdfplumber, text: "pdfplumber Page.extract_words returns a list of words and their bounding boxes.", holds: true}
