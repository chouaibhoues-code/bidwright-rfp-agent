seeds:
  - {id: RS-01, type: risk, note: "Go-live on 2027-10-01 comes three months before the migration deadline of 2027-12-31, so the teams start work without their history.", anchors: [GR-0034, GR-0024], terms: [[live, launch], [migrat]]}
  - {id: RS-02, type: risk, note: "The Quillbeck integration targets a system the Council replaces during 2028.", anchors: [GR-0023, GB-0001], terms: [[quillbeck, integrat, interface], [replac, retir]]}
  - {id: RS-03, type: risk, note: "The January peak of license renewals arrives three months after go-live, while the service is still new.", anchors: [GB-0003, GR-0034], terms: [[renewal, peak, january], [live, launch]]}
  - {id: RS-04, type: risk, note: "Duplicate resident records in eight percent of the Quillbeck data meet a migration that may lose no record.", anchors: [GB-0002, GR-0024], terms: [[duplicat, quality, cleans], [migrat]]}
  - {id: RS-05, type: risk, note: "The September window for penetration tests leaves no time to fix findings before go-live on 2027-10-01.", anchors: [GB-0006, GR-0028], terms: [[penetration, security test], [window, september]]}
  - {id: RS-06, type: risk, note: "The housing team moves offices in August and September 2027, when every user is to be trained.", anchors: [GB-0005, GR-0036], terms: [[move, office, relocat], [train]]}
  - {id: GS-01, type: gap, capability: "Integration with the Council's Quillbeck housing records system through its SOAP web service", absent_terms: [Quillbeck], anchors: [GR-0023]}
  - {id: GS-02, type: gap, capability: "Video calls with a British Sign Language interpreter on the resident portal", absent_terms: [sign language, BSL], anchors: [GR-0016]}
  - {id: GS-03, type: gap, capability: "A mobile application for field inspectors that works without a network connection", absent_terms: [offline, network connection], anchors: [GR-0010]}
  - {id: GS-04, type: gap, capability: "An accredited connection to the Halverton Public Services Network", absent_terms: [Public Services Network, HPSN], anchors: [GR-0026]}
  - {id: CS-01, type: clarification, anchors: [GR-0014], about: "\"appropriate response times\" has no measure"}
  - {id: CS-02, type: clarification, anchors: [GR-0021], about: "The number of concurrent named users is marked TBC"}
