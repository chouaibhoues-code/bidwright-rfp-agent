# For discover: one extraction, from a task with a report, an answer and three excerpts. Each
# item and need cites excerpts the task shows, and the pitfall rests on a tier 2 source as well
# as a tier 4 one, since code drops an item whose excerpts all come from tier 4.
discover:
  task:
    topics: ["home-to-school transport services", "passenger safety in school transport"]
    report: "# School transport\n\nRoutes are planned each year from pupils' eligibility [1].\n\nThe vetting of drivers and passenger assistants is a recurring weak point [2]."
    answers:
      - {question: "Which checks do school transport drivers need before they carry pupils?", answer: "Drivers and passenger assistants need an enhanced background check before they carry pupils [1].", excerpt_ids: [PX-0901]}
    excerpts:
      - {id: PX-0901, source_title: "Guidance on school transport safety", tier: 1, text: "Drivers and passenger assistants should hold an enhanced background check before they carry pupils, renewed at set intervals."}
      - {id: PX-0902, source_title: "Notes from a transport operator", tier: 4, text: "Routes planned once a year drift out of date as pupils move, so operators plan them again each term."}
      - {id: PX-0903, source_title: "A study of school route planning", tier: 2, text: "Planning routes again when pupils' eligibility changed cut journey times in the councils studied."}
    questions_left: 5
    jobs_left: 1
  extraction:
    summary: "School transport rests on routes planned from pupils' eligibility and on vetted drivers and passenger assistants; routes drift out of date as pupils move."
    items:
      - {kind: standard, statement: "Drivers and passenger assistants hold an enhanced background check, renewed at set intervals.", excerpt_ids: [PX-0901]}
      - {kind: pitfall, statement: "Routes planned once a year go out of date as pupils move; plan them again when eligibility changes.", excerpt_ids: [PX-0903, PX-0902]}
    needs:
      - {need: "Routes planned again when pupils' eligibility changes", excerpt_ids: [PX-0903]}
    open_questions: ["How often should background checks be renewed?"]
# decide (Iteration 3): two contrasting needs. The first is supported by records its search
# returned; the second asks for a named integration the knowledge base cannot show, so it is a
# gap: a generic REST API is not proof of it (BA-003). Ids are the examples' own.
decide:
  - need:
      need_id: RG-901
      origin: RFP
      topic: "Retention of signed consent forms"
      requirements:
        - {id: REQ-0901, statement: "Keep signed consent forms for ten years.", modality: shall, quote: "The Supplier shall keep signed consent forms for ten years.", src_ids: [SRC-0901]}
    found:
      - {id: CAP-901, kind: capability, name: "Document retention", text: "Retention periods are set for each document type and enforced automatically."}
      - {id: CS-901, kind: case_study, name: "A county council, local government", text: "Ten-year retention of planning records, enforced since 2023."}
    result:
      decision: RETRIEVE_EVIDENCE
      reason: "CAP-901 sets retention per document type, and CS-901 shows ten-year retention in use."
      claims:
        - {kind: capability, text: "Retention periods are set per document type and enforced automatically, so signed consent forms are kept for ten years.", evidence_ids: [CAP-901, CS-901], src_ids: [SRC-0901]}
  - need:
      need_id: RG-902
      origin: RFP
      topic: "Integration with the Trust's patient record system"
      requirements:
        - {id: REQ-0902, statement: "Integrate with the Halden patient record system.", modality: shall, quote: "The Supplier shall integrate with the Trust's Halden patient record system.", src_ids: [SRC-0902]}
    found:
      - {id: CAP-906, kind: capability, name: "REST API integration", text: "A documented REST API for exchanging data with other systems."}
    result:
      decision: PROCEED_WITH_GAP
      reason: "The knowledge base shows a generic REST API, which does not show an integration with the Halden system."
      claims: []
      gap: "No evidence of an integration with the Halden patient record system."
# assess (Iteration 3): one claim per disposition, each with its cited records and the buyer's
# need. Ids are the examples' own.
assess:
  - task:
      claim_kind: capability
      claim_text: "Signed consent forms are kept for ten years under a retention period set for their document type."
      evidence:
        - {id: CAP-901, kind: capability, name: "Document retention", text: "Retention periods are set for each document type and enforced automatically. Tags: own."}
        - {id: CS-901, kind: case_study, name: "A county council, local government", text: "A county council, local government, 2023. Ten-year retention of planning records, enforced since 2023."}
      need_text: "Keep signed consent forms for ten years."
    result: {reason: "CAP-901 states retention periods set per document type and enforced, and CS-901 shows a ten-year period in use.", disposition: SUPPORTED, supporting_ids: [CAP-901, CS-901], missing: ""}
  - task:
      claim_kind: capability
      claim_text: "Residents follow their consent requests on a portal tested to WCAG 2.2 AA, in English and Welsh."
      evidence:
        - {id: CAP-902, kind: capability, name: "Resident portal", text: "A web portal where residents follow their requests, tested against WCAG 2.2 at level AA. Tags: own."}
      need_text: "Offer the portal in English and Welsh."
    result: {reason: "CAP-902 states the portal and its WCAG 2.2 AA testing, but no record mentions Welsh.", disposition: PARTIALLY_SUPPORTED, supporting_ids: [CAP-902], missing: "A Welsh version of the portal."}
  - task:
      claim_kind: capability
      claim_text: "The service integrates with the Trust's Halden patient record system."
      evidence:
        - {id: CAP-906, kind: capability, name: "REST API integration", text: "A documented REST API for exchanging data with other systems. Tags: own."}
      need_text: "Integrate with the Halden patient record system."
    result: {reason: "CAP-906 states a generic REST API; no record names the Halden system or an integration with it.", disposition: UNVERIFIED, supporting_ids: [], missing: "Any integration with the Halden system."}
  - task:
      claim_kind: delivery
      claim_text: "All data is hosted in the United Kingdom."
      evidence:
        - {id: CAP-908, kind: capability, name: "Hosting", text: "Hosted in two data centers in Ireland, with replication between them. Tags: own."}
      need_text: "Host all data in the United Kingdom."
    result: {reason: "CAP-908 states hosting in Ireland, which contradicts hosting in the United Kingdom.", disposition: CONTRADICTED, supporting_ids: [], missing: "Hosting in the United Kingdom."}
  - task:
      claim_kind: certification
      claim_text: "The supplier holds ISO 9001."
      evidence:
        - {id: CERT-903, kind: certification, name: "ISO 9001", text: "ISO 9001, held by the supplier, valid until 2028-01-31."}
      need_text: "Keep signed consent forms for ten years."
    result: {reason: "CERT-903 states ISO 9001, but quality certification does not address keeping consent forms for ten years.", disposition: NOT_APPLICABLE, supporting_ids: [], missing: ""}
# options (Iteration 3): two options over a supported need and a gap, the baseline first.
options:
  task:
    factors:
      - {factor_id: EF-01, name: "Quality of the solution", weight: "60%", scoring: "Scored 0 to 4", status: IN_SCOPE}
      - {factor_id: EF-02, name: "Price", weight: "40%", scoring: "Lowest price scores highest", status: OUT_OF_SCOPE}
    needs:
      - {need_id: RG-901, origin: RFP, text: "Retention of signed consent forms", status: COVERED, claims: [{claim_id: CL-901, text: "Retention periods are set per document type and enforced automatically.", disposition: SUPPORTED}]}
