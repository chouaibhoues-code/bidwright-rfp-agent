<text x="1200" y="64.5" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#173047">ITERATION 3 TARGET | UNREVIEWED_DRAFT</text>
<rect x="60" y="180" width="300" height="130" rx="10" fill="#FFFFFF" stroke="#9DAFBD" stroke-width="1.5"/>
<text x="75" y="229.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#173047">01 Retrieve evidence</text>
<text x="75" y="255.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#173047">Verified RFP requirements</text>
<text x="75" y="276.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#173047">Retrieved supplier KB records</text>
<rect x="460" y="180" width="300" height="130" rx="10" fill="#E1F3EC" stroke="#5C9D89" stroke-width="1.5"/>
<text x="475" y="229.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#173047">02 Propose a claim</text>
<text x="475" y="255.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#173047">Decide agent names evidence</text>
<text x="475" y="276.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#173047">Code restricts IDs to records seen</text>
<rect x="860" y="180" width="300" height="130" rx="10" fill="#F0ECF9" stroke="#A18BC7" stroke-width="1.5"/>
<text x="875" y="229.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#173047">03 Blind assessment</text>
<text x="875" y="255.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#173047">Claim + cited records + need</text>
<text x="875" y="276.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#173047">No author reasoning or turns</text>
<rect x="1260" y="180" width="280" height="130" rx="10" fill="#EAF3F8" stroke="#769BB4" stroke-width="1.5"/>
<text x="1275" y="218.5" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#173047">04 Capability status</text>
<text x="1275" y="244.5" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#173047">Code applies the rule</text>
<text x="1275" y="265.5" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#173047">GAP / PARTNER</text>
<text x="1275" y="286.5" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#173047">COVERED / PARTIAL</text>
<rect x="60" y="355" width="710" height="82" rx="10" fill="#F8FAFC" stroke="#D3DEE6" stroke-width="1.5"/>
<text x="76" y="391.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#173047">No cited evidence → UNVERIFIED in code, with no assessor call. A verified quote proves</text>
<text x="76" y="412.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#173047">grounding, not complete requirement coverage.</text>
<rect x="810" y="355" width="730" height="82" rx="10" fill="#F8FAFC" stroke="#D3DEE6" stroke-width="1.5"/>
<text x="826" y="391.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#173047">The assessment route is fixed for a run and recorded. Another model family is hygiene; joint error</text>
<text x="826" y="412.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#173047">and owner labels test its reliability.</text>
<rect x="60" y="490" width="300" height="130" rx="10" fill="#E1F3EC" stroke="#5C9D89" stroke-width="1.5"/>
<text x="75" y="539.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#173047">08 Risk register</text>
<text x="75" y="565.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#173047">Triggers, evidence and response</text>
<text x="75" y="586.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#173047">Date/SLA arithmetic in code</text>
<rect x="460" y="490" width="300" height="130" rx="10" fill="#EAF3F8" stroke="#769BB4" stroke-width="1.5"/>
<text x="475" y="539.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#173047">07 Technology checks</text>
<text x="475" y="565.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#173047">Documentation supports verdicts</text>
<text x="475" y="586.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#173047">Verdict quotes checked in code</text>
<rect x="860" y="490" width="300" height="130" rx="10" fill="#F0ECF9" stroke="#A18BC7" stroke-width="1.5"/>
<text x="875" y="528.5" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#173047">06 Solution manifest</text>
<text x="875" y="554.5" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#173047">Sourced facts and work packages</text>
<text x="875" y="575.5" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#173047">Binding requirements mapped or</text>
<text x="875" y="596.5" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#173047">explicit gaps</text>
<rect x="1260" y="490" width="280" height="130" rx="10" fill="#F0ECF9" stroke="#A18BC7" stroke-width="1.5"/>
