<text x="106" y="827.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#173047">Review options, gaps, manifest</text>
<text x="106" y="849.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#173047">Technology verdicts and risks</text>
