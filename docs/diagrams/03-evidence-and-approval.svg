<text x="1275" y="565.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#173047">Published factors and weights</text>
<text x="1275" y="586.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#173047">Code totals and tie-breaks</text>
