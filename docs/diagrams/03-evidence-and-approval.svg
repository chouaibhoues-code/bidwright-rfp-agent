<text x="585" y="801.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#173047">Approve</text>
<text x="585" y="827.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#173047">Continue to drafting</text>
<text x="585" y="848.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#173047">Draft label remains</text>
<rect x="900" y="762" width="280" height="110" rx="10" fill="#FFF0D5" stroke="#D2A052" stroke-width="1.5"/>
<text x="915" y="801.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#173047">Edit / change option</text>
<text x="915" y="827.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#173047">Rebuild or recheck</text>
<text x="915" y="848.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#173047">Technology and risk rerun</text>
<rect x="1230" y="762" width="280" height="110" rx="10" fill="#FBEDEC" stroke="#C78A84" stroke-width="1.5"/>
<text x="1245" y="801.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#173047">Reject / block</text>
<text x="1245" y="827.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#173047">POLICY_BLOCKED</text>
<text x="1245" y="848.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#173047">No draft is produced</text>
<text x="60" y="70" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#173047">Bidwright | from a claim to a reviewed draft</text>
<text x="60" y="110" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#566A7D">Independent evidence checks, deterministic coverage, and a human boundary before drafting</text>
<text x="60" y="975" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#566A7D">BIDWRIGHT / Submission diagrams / Accepted Iteration 3 design / Verify against the final build</text>
<text x="550" y="729" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#566A7D">HUMAN REVIEW / APPROVAL HASHES BIND THE MANIFEST AND OPTIONS</text>
<text x="60" y="946" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#566A7D">Approval permits the workflow to continue. It does not sign off a bid, remove UNREVIEWED_DRAFT, or submit anything.</text>
