<text x="78" y="843.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#173047">Controlled agent comparisons</text>
<text x="78" y="870.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#173047">EX / SO / RK ladders; frozen seeds for solution and risk</text>
<text x="78" y="892.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#173047">Five repeats, intervals and keep/drop decisions; costs beside quality</text>
<rect x="820" y="800" width="720" height="120" rx="10" fill="#FFF0D5" stroke="#D2A052" stroke-width="1.5"/>
<text x="838" y="843.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#173047">Release evidence | targets, not measured results</text>
<text x="838" y="870.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#173047">Five live hero repeats: QS-2 median ≤2/45 misses; QS-3 no trap action</text>
<text x="838" y="892.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#173047">QS-5 no seeded gap claimed; QS-8 median Jaccard ≥0.85; ten owner labels</text>
<text x="60" y="70" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#173047">Bidwright | evidence that the system works</text>
<text x="60" y="110" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#566A7D">Quality and operational telemetry are separate streams, joined by the same run identity</text>
<text x="60" y="975" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#566A7D">BIDWRIGHT / Submission diagrams / Accepted Iteration 3 design / Verify against the final build</text>
<text x="82" y="359" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#566A7D">QUALITY / SEPARATE EVALUATION HARNESS</text>
<text x="842" y="359" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#566A7D">OPERATIONS / TELEMETRY</text>
<text x="60" y="948" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#566A7D">Replay time is not live provider latency. Shadow cost is not a charge. Report remaining misses and accepted exceptions explicitly.</text>
