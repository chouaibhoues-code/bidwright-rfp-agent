<text x="110" y="619.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#173047">Headline: missed mandatory requirements and submission hazards</text>
<text x="110" y="641.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#173047">Grounding, trap actions and unauthorized calls</text>
<text x="110" y="663.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#173047">Unsupported capabilities, manifest checks and technology verdicts</text>
