<text x="863.0" y="448.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#173047">Tokens by category, retries, status history, model/provider route</text>
<text x="863.0" y="470.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#173047">Active latency, charged cost and paid-rate shadow cost</text>
