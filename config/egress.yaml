# The egress register (ADR-026, D-05): every destination a run may reach, with its hosts,
# whether it is local, and what it may receive. Every outbound client, the trace endpoint and
# the parser service are checked against it and the run's data class (Iteration 1, step 9).
# A host is local when it is a loopback address, `localhost`, a Compose service named here, or
# `host.docker.internal`, which a container uses to reach the machine running it (its Ollama).
# A destination marked `local: false` is remote whatever its host: the NotebookLM server runs on
# this machine but forwards every query it receives to Google (ADR-036).
destinations:
  gemini:  {hosts: [generativelanguage.googleapis.com], local: false, receives: prompts}
  # Iteration 3 (ADR-045, ADR-044): assess's providers, and Context7 for techcheck's queries.
  cerebras: {hosts: [api.cerebras.ai], local: false, receives: prompts}
  groq:    {hosts: [api.groq.com], local: false, receives: prompts}
  context7: {hosts: [mcp.context7.com], local: false, receives: queries}
  ollama:  {hosts: [localhost, "127.0.0.1", ollama, host.docker.internal], local: true, receives: prompts}
  phoenix: {hosts: [localhost, "127.0.0.1", phoenix], local: true, receives: spans}
  docling: {hosts: [localhost, "127.0.0.1", docling], local: true, receives: documents}
  notebooklm: {hosts: [localhost, "127.0.0.1", host.docker.internal], local: false, receives: queries}
