# Per-run limits by RFP and profile. The clock counts only time spent RUNNING. The `paid`
# profile runs the free models under the paid key (CH-82) with the free run limits and a
# higher concurrency; its rate limits below are the paid project's, read in AI Studio (V-03).
runs:
  dev:
    free:  {requests: 60, tokens: 300000, active_minutes: 20}
    local: {requests: 60, tokens: 300000, active_minutes: 60}
    paid:  {requests: 60, tokens: 300000, active_minutes: 20}
  hero:
    free:  {requests: 250, tokens: 2000000, active_minutes: 90}
    paid:  {requests: 250, tokens: 2000000, active_minutes: 90}
call:
  # Per profile. A 4B model on CPU needs more than 60 s for a cold load or a long answer (S-04),
  # and gemini-3.8-flash answered in 55-60 s under load, then hit the 60 s deadline (504).
  timeout_s: {free: 120, local: 300, paid: 120}
  retries: 3
  backoff_base_s: 2
  backoff_cap_s: 30
# Send workers at once, per profile. Ollama here serves one request at a time, so a second
# worker only queues, and its wait counts against the call timeout.
concurrency: {free: 2, local: 1, paid: 4}
# Passages per extract pack, at most; a pack also closes before it passes the extract budget.
# S-03 set it on 2026-11-04 (ADR-027): packs of 40 stayed within the noise of packs of 10.
batch_size: 40
# The limiter (step 9), keyed by provider, tier and model. The tier is the profile's, `free` or
# `paid`. A provider or model with no row here, such as Ollama, has no limiter.
providers:
  gemini:
    quota_day_tz: America/Los_Angeles
    tiers:
      # The free tier's daily count is observed, not enforced: Google's own daily 429 stops
      # the calls, and only then do runs move to `paid` (ADR-029, the owner's decision).
      free:
        gemini-3.5-flash-lite: {rpm: 15, tpm: 250000, rpd: 500, reserve: 0.2, daily: observe}
        gemini-3.1-flash-lite: {rpm: 15, tpm: 250000, rpd: 500, reserve: 0.2, daily: observe}
      # The paid project's limits, read in AI Studio on 2026-11-04 (V-03).
      paid:
        gemini-3.5-flash-lite: {rpm: 4000, tpm: 4000000, rpd: 150000, reserve: 0.0}
        gemini-3.1-flash-lite: {rpm: 4000, tpm: 4000000, rpd: 150000, reserve: 0.0}
  # Iteration 3 (ADR-045): one row each, used on every profile, since one account holds one
  # quota. Read on 2026-11-05 from the providers' published limits (C7-02, C7-03), to be
  # checked against the accounts' limits pages. Cerebras's trial gives gpt-oss-120b 5 requests
  # and 30K input tokens a minute and 1M tokens a day, and lists no daily request cap, so rpd is
  # what 5 a minute allows; its credits run until 2026-12-03 (D-03). Groq's free plan gives
  # openai/gpt-oss-120b 30 requests and 8K tokens a minute, 1K requests and 200K tokens a day.
  cerebras:
    quota_day_tz: UTC
    tiers:
      trial:
        gpt-oss-120b: {rpm: 5, tpm: 30000, rpd: 7200, tpd: 1000000, reserve: 0.0}
  groq:
    quota_day_tz: UTC
    tiers:
      free:
        openai/gpt-oss-120b: {rpm: 30, tpm: 8000, rpd: 1000, tpd: 200000, reserve: 0.0}
coverage: {max_rounds: 2, gap_pack_size: 5}
clusters: {max_members: 12, max_context: 8, duplicate_jaccard: 0.6}
context: {budgets: {triage: 8000, extract: 12000, consolidate: 8000, brief: 8000, discover: 16000, approach: 16000, risk: 16000, draft: 10000, decide: 16000}, chars_per_token: 4, neighbors: 1, max_terms: 10}
cache: {matrix: true, single: false}
# S-13 turned the second pass on, on 2026-11-04 (ADR-028).
second_pass: true
retention: {client_days: 30}        # D-05
# The circuit breaker (Iteration 2): this many consecutive failed attempts on one model and tier,
# or one MCP server, open it for this long.
breaker: {failures: 5, cooldown_minutes: 30}
# Iteration 3 (ADR-039): the needs decide takes a run, RFP needs first, and the claims each
# need may draft. Needs past the cap are listed GAP and the run ends DEGRADED.
solution: {need_cap: 24, claims_per_need: 3}
