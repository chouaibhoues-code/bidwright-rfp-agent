# Statistical scenarios on hero package (Iteration 3, step 20).
# 5 live repeats on hero package with switches defaults, research mode pack, automatic approval.
# Scored for QS-2, QS-3, QS-5, QS-8.
# Starts on `free`; when a run pauses on the daily quota, `profile` becomes `paid` and the
# matrix resumes with --resume (the owner's rule of 2026-11-06). Both profiles run the same
# models, and each run's manifest records its profile.
name: hero-repeats
rfp: inputs/hero
profile: free
repeats: 5
until: render
max_cost_usd: 6
allow_degraded: []
rungs:
  - name: default
    flags: {research: pack}
