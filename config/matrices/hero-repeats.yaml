# Statistical scenarios on hero package (Iteration 3, step 20).
# 5 live repeats on hero package with switches defaults, research mode pack, automatic approval.
# Scored for QS-2, QS-3, QS-5, QS-8.
# Starts on `free`; when a run pauses on the daily quota, `profile` becomes `paid` and the
# matrix resumes with --resume (the owner's rule of 2026-11-06). Both profiles run the same
# models, and each run's manifest records its profile.
name: hero-repeats
rfp: inputs/hero
# Run again on 2026-11-13 after the drift report's fixes (decide's excerpts and requirement
# lookup), starting on free; the step-20 runs moved to paid on 2026-11-07 when the free
# daily quota ran out during default-r1.
profile: free
repeats: 5
until: render
max_cost_usd: 6
# Passages left without a disposition after the coverage loop are part of what QS-2 measures,
# as on the EX ladder, so such a repeat counts as it ended rather than running again.
allow_degraded: ["coverage:"]
rungs:
  - name: default
    flags: {research: pack}
