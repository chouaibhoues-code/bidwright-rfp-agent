# S-13: a second extraction pass over OBLIGATION zones (Iteration 1, step 18). It is turned on
# only if `on` lowers the median misses while precision falls by at most 3 points (step 20).
# The rung names are quoted, because YAML reads a bare on and off as booleans.
# Run on 2026-11-04 after S-10, on the prompt S-10 chose: its rule dropped the examples, so both
# rungs use `extract_noexamples` until `extract.md` takes that text. The free quota was spent,
# so the matrix runs on `paid` (CH-82), with the same models and settings.
# `extract_noexamples` was retired after this run, since `extract.md` 0.4.0 holds its text
# (ADR-028); to run this file again, drop the `extract_prompt` flags. Until then the matrix
# runner refuses it before anything starts.
name: s13-second-pass
rfp: inputs/hero
profile: paid
repeats: 5
until: coverage
max_cost_usd: 10
rungs:
  - {name: "off", flags: {second_pass: false, extract_prompt: extract_noexamples}}
  - {name: "on", flags: {second_pass: true, extract_prompt: extract_noexamples}}
