# The SO ladder: solution generation from one-shot to full manifest (Iteration 3, step 19).
# Seeded from outputs/seeds/so-seed (one EX3-configuration run to brief, frozen).
# Metric is gap_assertions (lower, margin 0), secondary is approach_mapping (higher).
# Cap: $8, 5 repeats.
# Starts on `free`; when a run pauses on the daily quota, `profile` becomes `paid` and the
# matrix resumes with --resume (the owner's rule of 2026-11-06). Both profiles run the same
# models, and each run's manifest records its profile.
name: so-ladder
rfp: inputs/hero
profile: free
seed_run: outputs/seeds/so-seed
seed_from: research
repeats: 5
max_cost_usd: 8
allow_degraded: []
rungs:
  - name: so0
    flags: {solution: oneshot}
  - name: so1-f
    flags: {solution: fixed}
  - name: so1
    flags: {solution: decide}
  - name: so1-t
    flags: {solution: decide, reflect: true}
  - name: so2
    flags: {solution: assess}
  - name: so3
    flags: {solution: manifest}
