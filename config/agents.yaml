# What each LLM call may do. ExecutionPolicy and ToolGateway enforce this file,
# and docs/agents.md is generated from it (from Iteration 0b). A function makes one call and
# one repair, fixed in the node code, so only the agent's loop declares limits (ADR-025).
extract:
  kind: function
  input: ExtractBatch
  output: ExtractResult
  prompt: extract@0.2.0
  model_role: extract
  tools: []

approach:
  kind: function
  input: ApproachInput
  output: ApproachResult
  prompt: approach@0.2.0
  model_role: reason
  tools: []

risk:
  kind: agent
  input: RiskInput
  output: RiskRegister
  prompt: risk@0.2.0
  model_role: reason
  tools: [search_rfp, date_calc]
  limits: {max_turns: 4, max_tool_calls: 6, stop_on_no_progress: true}

draft:
  kind: function
  input: DraftTask
  output: DraftResult
  prompt: draft@0.2.0
  model_role: reason
  tools: []
