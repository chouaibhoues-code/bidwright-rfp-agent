# What each LLM call may do. config.py validates this file at startup, the nodes read their
# tools and limits from it, and ToolGateway enforces the allowlists and caps (ADR-037);
# docs/agents.md is generated from it. A function makes one call and one repair, fixed in the
# node code, so only the agent's loop declares limits (ADR-025). An entry arrives with its
# prompt, since every run loads the prompt of every agent listed here.
triage:
  kind: function
  input: TriageInput
  output: TriageResult
  prompt: triage@0.1.0
  model_role: extract
  tools: []

brief:
  kind: function
  input: BriefInput
  output: BriefResult
  prompt: brief@0.2.0
  model_role: extract
  tools: []

# The turn limit bounds each pass of discover_ask; the call cap counts discover_start's and
# discover_ask's calls together, from research.json, across nodes and resumes.
discover:
  kind: agent
  input: DiscoveryTask
  output: DiscoveryExtract
  prompt: discover@0.4.0
  model_role: reason
  tools: [ask_research, start_research]
  limits: {max_turns: 4, max_tool_calls: 8, stop_on_no_progress: true}

extract:
  kind: function
  input: ExtractBatch
  output: ExtractResult
  prompt: extract@0.4.0
  model_role: extract
  tools: []

approach:
  kind: function
  input: ApproachInput
  output: ApproachResult
  prompt: approach@0.2.0
  model_role: reason
  tools: []

risk:
  kind: agent
  input: RiskInput
  output: RiskRegister
  prompt: risk@0.2.0
  model_role: reason
  tools: [search_rfp, date_calc]
  limits: {max_turns: 4, max_tool_calls: 6, stop_on_no_progress: true}

# Iteration 3 (ADR-039, ADR-040): one loop per need; ask_research reads the run's own research.
decide:
  kind: agent
  input: DecideTask
  output: DecideResult
  prompt: decide@0.1.0
  model_role: reason
  tools: [search_capabilities, search_rfp, read_section, ask_research]
  limits: {max_turns: 4, max_tool_calls: 6, stop_on_no_progress: true}

# Iteration 3 (ADR-045): one call per claim with evidence, on the assess role's route.
assess:
  kind: function
  input: AssessmentTask
  output: AssessmentResult
  prompt: assess@0.1.0
  model_role: assess
  tools: []

# Iteration 3 (ADR-041): one call proposes and scores the options; code weights and ranks them.
options:
  kind: function
  input: OptionsTask
  output: OptionsResult
  prompt: options@0.1.0
  model_role: reason
  tools: []

# Iteration 3 (ADR-043): P01 plans and P02 details the chosen option; code checks both. P02's
# calls, and P03's revision, run under the node name blueprint.
blueprint:
  kind: function
  input: BlueprintPlanTask
  output: BlueprintPlan
  prompt: blueprint@0.1.0
  model_role: reason
  tools: []

blueprint_detail:
  kind: function
  input: BlueprintDetailTask
  output: BlueprintDetail
  prompt: blueprint_detail@0.1.0
  model_role: reason
  tools: []

# Iteration 3 (ADR-044): one assess-role verdict per checkable technology claim. The two tools
# are the Context7 calls code makes, listed so the allowlist and the scorer cover them.
techcheck:
  kind: function
  input: TechVerdictTask
  output: TechVerdict
  prompt: techcheck@0.1.0
  model_role: assess
  tools: [resolve-library-id, query-docs]

# Iteration 3 (step 9): RK0 and RK1-F, the risk agent's one-call baselines; their calls run
# under the node name risk.
risk_oneshot:
  kind: function
  input: RiskFixedInput
  output: RiskRegister
  prompt: risk_oneshot@0.1.0
  model_role: reason
  tools: []

draft:
  kind: function
  input: DraftTask
  output: DraftResult
  prompt: draft@0.2.0
  model_role: reason
  tools: []

consolidate:
  kind: function
  input: ClusterTask
  output: ConsolidationResult
  prompt: consolidate@0.1.0
  model_role: reason
  tools: []
