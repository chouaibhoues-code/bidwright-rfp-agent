# What each LLM call may do. config.py validates this file at startup, the nodes read their
# tools and limits from it, and ToolGateway enforces the allowlists and caps (ADR-037);
# docs/agents.md is generated from it. A function makes one call and one repair, fixed in the
# node code, so only the agent's loop declares limits (ADR-025). An entry arrives with its
# prompt, since every run loads the prompt of every agent listed here.
triage:
  kind: function
  input: TriageInput
  output: TriageResult
  prompt: triage@0.1.0
  model_role: extract
  tools: []

extract:
  kind: function
  input: ExtractBatch
  output: ExtractResult
  prompt: extract@0.4.0
  model_role: extract
  tools: []

approach:
  kind: function
  input: ApproachInput
  output: ApproachResult
  prompt: approach@0.2.0
  model_role: reason
  tools: []

risk:
  kind: agent
  input: RiskInput
  output: RiskRegister
  prompt: risk@0.2.0
  model_role: reason
  tools: [search_rfp, date_calc]
  limits: {max_turns: 4, max_tool_calls: 6, stop_on_no_progress: true}

draft:
  kind: function
  input: DraftTask
  output: DraftResult
  prompt: draft@0.2.0
  model_role: reason
  tools: []

consolidate:
  kind: function
  input: ClusterTask
  output: ConsolidationResult
  prompt: consolidate@0.1.0
  model_role: reason
  tools: []
