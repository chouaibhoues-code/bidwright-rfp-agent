# Paid list prices in USD per million tokens, Standard tier. read_on is when the price list was
# read; V-03 rechecks before any figure is reported. Null dates are open-ended. Thinking tokens
# are billed as output. cached_input is the context-caching rate; cache storage is not priced.
models:
  - {model: gemini-3.8-flash, effective_from: null, effective_to: 2026-12-31, read_on: 2026-11-02,
     usd_per_mtok: {input: 0.75, output: 3.75, thinking: 3.75, cached_input: 0.075},
     source: "https://ai.google.dev/gemini-api/docs/pricing"}
  - {model: gemini-3.8-flash, effective_from: 2027-01-01, effective_to: null, read_on: 2026-11-02,
     usd_per_mtok: {input: 1.50, output: 7.50, thinking: 7.50, cached_input: 0.15},
     source: "https://ai.google.dev/gemini-api/docs/pricing"}
  - {model: gemini-3.5-flash-lite, effective_from: null, effective_to: null, read_on: 2026-11-02,
     usd_per_mtok: {input: 0.30, output: 2.50, thinking: 2.50, cached_input: 0.03},
     source: "https://ai.google.dev/gemini-api/docs/pricing"}
  - {model: gemini-3.1-flash-lite, effective_from: null, effective_to: null, read_on: 2026-11-02,
     usd_per_mtok: {input: 0.25, output: 1.50, thinking: 1.50, cached_input: 0.025},
     source: "https://ai.google.dev/gemini-api/docs/pricing"}
  # Iteration 3 (ADR-045): the assess role's model on Cerebras and on Groq, list prices read
  # on 2026-11-05. Both accounts are free, so these price the shadow cost only.
  - {model: gpt-oss-120b, effective_from: null, effective_to: null, read_on: 2026-11-05,
     usd_per_mtok: {input: 0.35, output: 0.75, thinking: 0.75, cached_input: null},
     source: "https://inference-docs.cerebras.ai/support/pricing"}
  - {model: openai/gpt-oss-120b, effective_from: null, effective_to: null, read_on: 2026-11-05,
     usd_per_mtok: {input: 0.15, output: 0.60, thinking: 0.60, cached_input: null},
     source: "https://console.groq.com/docs/models"}
# The paid rate used to price free and local calls, so runs compare fairly. A call on the
# assess role's route `same` takes the reason role's shadow model.
shadow_model:
  extract: gemini-3.5-flash-lite
  reason: gemini-3.5-flash-lite  # the model the free profile runs for reason (ADR-003)
  assess: gpt-oss-120b
