[project]
name = "bidwright"
version = "0.2.0"
description = "Bidwright: an agentic RFP-to-proposal system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime dependencies are added step by step in Iteration 0a; V-08 locks the versions.
dependencies = [
    "google-genai>=1.30,<3",
    "httpx>=0.27,<1",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "lxml>=5,<7",
    "mcp>=1.30,<2",
    "ollama>=0.5,<1",
    "openai>=2,<4",
    "openinference-semantic-conventions>=0.1.20,<1",
    "openpyxl>=3.1,<4",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "pdfminer-six==20260107",
    "pdfplumber>=0.11,<1",
    "pikepdf>=9,<10",
    "pydantic>=2.10,<3",
    "python-docx>=1.2,<2",
    "pyyaml>=6,<7",
    "tzdata>=2025.1",
]

[project.scripts]
bidwright = "bidwright.cli:main"
bidwright-eval = "evals.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyright",
    "pip-audit",
    "types-pyyaml>=6.0.12.20261030",
    "reportlab>=4,<5",
    "hypothesis>=6,<7",
    "types-lxml>=2026.2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bidwright", "evals"]
# What never ships: gold, corpus specs, results and labels (the eval service mounts them), and
# the spikes, which are experiments run from the checkout. The image excludes the same paths.
exclude = ["evals/corpus", "evals/gold", "evals/results", "evals/labels", "evals/spikes"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "gold: needs evals/gold or the corpus specs; runs in the eval service and the host CI job",
    "replay: runs on recorded cassettes",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "S603", "S607"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["src", "evals", "tests", "scripts"]
