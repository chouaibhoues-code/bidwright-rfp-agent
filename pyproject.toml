[project]
name = "bidwright"
version = "0.0.0"
description = "Bidwright: an agentic RFP-to-proposal system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime dependencies are added step by step in Iteration 0a; V-08 locks the versions.
dependencies = []

[project.scripts]
bidwright = "bidwright.cli:main"
bidwright-eval = "evals.cli:main"

[dependency-groups]
dev = ["pytest", "ruff", "pyright", "pip-audit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bidwright", "evals"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "gold: needs evals/gold or the corpus specs; runs in the eval service and the host CI job",
    "replay: runs on recorded cassettes",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["src", "evals", "tests"]
